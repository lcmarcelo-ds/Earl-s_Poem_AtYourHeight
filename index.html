<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101f2a"><title>At Your Height · A small observation</title>
<style>
:root{--bg:#101f2a;--ink:#f6ecda;--muted:#b2b9b7;--gold:#e9bc7e;--line:#ffffff21;--panel:#ffffff06}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;transition:background .8s,color .8s;min-height:100svh}body.day{--bg:#f5ecdd;--ink:#263c44;--muted:#626e70;--gold:#93652f;--line:#263c4426;--panel:#ffffff55}body:before{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 85% 20%,#d5a56017,transparent 48%),radial-gradient(ellipse at 5% 100%,#73b1b918,transparent 40%)}button{font:inherit;cursor:pointer;color:inherit}button:focus-visible{outline:2px solid var(--gold);outline-offset:5px}button:disabled{opacity:.25;cursor:default}.shell{max-width:1160px;margin:auto;padding:30px 44px}header{display:flex;align-items:center;justify-content:space-between;gap:18px;border-bottom:1px solid var(--line);padding-bottom:24px}.brand,.eyebrow,.number,footer{font-size:10px;letter-spacing:.22em;text-transform:uppercase}.brand{line-height:1.7}.brand span{display:block;color:var(--muted);font-size:9px}.tools{display:flex;gap:10px}.quiet{border:1px solid var(--line);background:var(--panel);border-radius:30px;padding:10px 15px;font-size:12px}.quiet:hover{border-color:var(--gold)}main{display:grid;grid-template-columns:1fr 1.25fr;gap:70px;align-items:center;min-height:690px;padding:60px 0}.eyebrow{color:var(--gold);margin-bottom:22px}.title{font-family:Georgia,serif;font-size:clamp(62px,7.8vw,104px);font-weight:400;line-height:1;margin:0;letter-spacing:-.055em}.title em{font-weight:400;color:var(--gold)}.intro{color:var(--muted);max-width:260px;font-size:14px;line-height:1.9;margin:25px 0}.orbit{height:150px;position:relative;width:220px;margin-top:45px}.orbit:before,.orbit:after{content:'';position:absolute;border:1px solid var(--line);border-radius:50%;width:130px;height:130px;left:10px;top:0}.orbit:after{left:65px;top:10px}.star{position:absolute;left:89px;top:36px;font-size:55px;color:var(--gold);animation:breathe 6s ease-in-out infinite}.orbit small{position:absolute;top:145px;left:15px;font-size:9px;letter-spacing:.2em;color:var(--muted)}.card{position:relative;border-top:1px solid var(--gold);padding:28px 0 0;min-width:0}.cardhead{display:flex;justify-content:space-between;color:var(--muted);margin-bottom:30px}.number{color:var(--gold)}h2{font-weight:400;font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin:0}.verse{font-family:Georgia,serif;font-size:clamp(21px,2.1vw,27px);line-height:1.55;white-space:pre-line;min-height:350px;animation:arrive .6s ease both}.verse em{color:var(--gold)}.nav{display:flex;justify-content:space-between;gap:12px;margin-top:28px;align-items:center}.primary{border:0;border-radius:50px;padding:15px 23px;background:var(--gold);color:var(--bg);font-size:13px;font-weight:600;min-height:46px}.back{background:none;border:0;padding:12px 0;font-size:13px;color:var(--muted)}.dots{display:flex;gap:7px;margin-top:30px}.dot{border:0;padding:0;width:100%;height:4px;border-radius:5px;background:var(--line);min-height:14px;background-clip:content-box;padding-top:5px;padding-bottom:5px}.dot.active{background-color:var(--gold)}footer{padding:22px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;color:var(--muted);font-size:9px;line-height:1.8}.status{font-size:11px;color:var(--muted);min-height:18px;margin-top:12px}.full{font:20px/1.7 Georgia,serif;white-space:pre-line}dialog{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:20px;max-width:650px;width:90%;max-height:85svh;padding:30px}dialog::backdrop{background:#000a;backdrop-filter:blur(6px)}.modalhead{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-30px;padding:18px 0;background:var(--bg)}@keyframes arrive{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes breathe{50%{opacity:.5;transform:scale(.9)}}@media(max-width:760px){.shell{padding:22px}header{gap:10px}.quiet{padding:9px 11px;font-size:11px}main{grid-template-columns:1fr;gap:34px;padding:36px 0;min-height:0}.title{font-size:64px}.intro{max-width:none;margin:16px 0 0}.orbit{display:none}.verse{min-height:335px;font-size:23px}.cardhead{margin-bottom:22px}.eyebrow{margin-bottom:16px}footer{letter-spacing:.1em}.brand{font-size:9px}.brand span{font-size:8px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><div class="shell"><header><div class="brand">A small observation<span>For Earl · From Lloyd</span></div><div class="tools"><button class="quiet" id="light" aria-label="Switch to warm daylight">Warm light ☼</button><button class="quiet" id="read">Listen ♫</button></div></header>
<main><section><div class="eyebrow">An ordinary kind of extraordinary</div><h1 class="title">At Your<br><em>Height.</em></h1><p class="intro">For the person beneath the white coat.<br>A few things worth noticing.</p><div class="orbit" aria-hidden="true"><span class="star">✦</span><small>A LITTLE WARMTH, AFTER HOURS</small></div></section><section class="card" aria-label="Poem reader"><div class="cardhead"><h2 id="chapter"></h2><span class="number" id="count"></span></div><div id="verse" class="verse" aria-live="polite"></div><nav class="nav" aria-label="Poem navigation"><button class="back" id="prev">← Previous</button><button class="primary" id="next">Turn the page →</button></nav><div class="dots" id="dots"></div><div class="status" id="status" role="status"></div></section></main>
<footer><span>A poem in eight small scenes</span><button class="back" id="all" style="font-size:11px;padding:0">Read it all ↗</button></footer></div><dialog id="modal"><div class="modalhead"><h2>At Your Height</h2><button class="quiet" id="close">Close ×</button></div><div class="full" id="full"></div></dialog>
<script>
const scenes=[
['A world at full volume',`The world must look enormous\nwhen you’re small.\n\nDoors too heavy.\nChairs too tall.\nA room full of grown-ups\nspeaking over your head\nabout something\nhappening inside your body.\n\nEven the light\nhas nowhere soft to land.`],
['Enter, you',`And into this room\n\nyou.\n\nA tired pediatrician\nunder hospital fluorescents.\n\nWhich, frankly,\nare a terrible choice\nfor someone\nwith your face.\n\nBut we’ll discuss\nthe lighting later.`],
['At their height',`There are smaller people\nwith larger concerns.\n\nA needle.\nA strange sound.\nThe frightening possibility\nthat this might hurt.\n\nI keep thinking\nabout the distance\nbetween knowing medicine\nand knowing\nhow to be gentle.`],
['The quiet work',`How much a person\nmust carry in his head\n\nand how carefully\nhe must choose\nwhat reaches his voice.\n\nThe room asks for speed.\nA frightened child\nmay need a moment.\n\nAnd somewhere\nbetween those two demands,\nthere is the work you do.`],
['An unnecessary complication',`Beyond the title.\nBeyond the white coat.\nIn the difficult, ordinary act\nof paying attention\nwhen the night\nhas already asked so much.\n\nThat part of you\nstays with me.\n\nThough, to be fair,\nyou make it difficult\nto maintain\na strictly academic interest.\n\nThere is the smile.\nAn unnecessary complication.`],
['Off the clock',`There is the laugh,\nwhich I suspect\nhas never once considered\nthe consequences\nof arriving\non that face.\n\nAnd there is you\nafter the shift\n\nallowed to be hungry.\nAllowed to be quiet.\nAllowed to have\nabsolutely nothing profound\nto say.\n\nYou can leave\nthe remarkable part\nunattended for a while.\nIt will still be there\nafter dinner.`],
['Both things, one person',`Because what catches my attention\nis how both things\nfit inside one person:\n\nthe responsibility,\nand the ridiculous joke;\n\nthe tired eyes,\nand the mischief\nstill awake behind them;\n\nthe doctor\nwho spends his hours\ntaking other people seriously,\n\nand the man\nI would very much enjoy\nmaking laugh.`],
['The whole stage',`So let the hospital\nkeep its fluorescent lights.\n\nSomewhere,\nthere is a warmer room.\nA meal arriving.\nA chair you can settle into\nwithout immediately\nhaving to stand again.\n\nAnd you,\nhalfway through a story,\nfinally laughing\ntoo much to finish it.\n\nThere.\n\nThat is the part\nI would give\nthe whole stage to.`]
];
let current=0,speaking=false,utterance=null;const $=id=>document.getElementById(id);
function stop(){if('speechSynthesis'in window)speechSynthesis.cancel();speaking=false;$('read').textContent='Listen ♫'}
function render(){stop();$('chapter').textContent=scenes[current][0];$('count').textContent=String(current+1).padStart(2,'0')+' / 08';const v=$('verse');v.textContent=scenes[current][1];v.style.animation='none';void v.offsetWidth;v.style.animation='';$('prev').disabled=current===0;$('next').textContent=current===7?'One more time ↺':'Turn the page →';$('status').textContent=current===7?'That’s all. Carry on being distracting.':'';[...$('dots').children].forEach((b,i)=>{b.classList.toggle('active',i===current);b.setAttribute('aria-current',i===current?'step':'false')})}
scenes.forEach((s,i)=>{let b=document.createElement('button');b.className='dot';b.setAttribute('aria-label','Scene '+(i+1)+': '+s[0]);b.onclick=()=>{current=i;render()};$('dots').appendChild(b)});
$('next').onclick=()=>{current=(current+1)%8;render()};$('prev').onclick=()=>{if(current>0){current--;render()}};
$('light').onclick=()=>{const day=document.body.classList.toggle('day');$('light').textContent=day?'Midnight ☾':'Warm light ☼';$('light').setAttribute('aria-label',day?'Switch to midnight':'Switch to warm daylight')};
$('read').onclick=()=>{if(!('speechSynthesis'in window)){ $('status').textContent='Read-aloud isn’t available in this browser. Every verse is here to read.';return}if(speaking){stop();return}utterance=new SpeechSynthesisUtterance(scenes[current][1]);utterance.lang='en-US';utterance.rate=.85;utterance.onend=()=>{speaking=false;$('read').textContent='Listen ♫'};utterance.onerror=()=>{speaking=false;$('read').textContent='Listen ♫';$('status').textContent='Audio unavailable. You can still read every scene.'};speaking=true;$('read').textContent='Stop ■';speechSynthesis.speak(utterance)};
$('full').textContent=scenes.map(s=>s[1]).join('\n\n');$('all').onclick=()=>{stop();$('modal').showModal()};$('close').onclick=()=>$('modal').close();document.addEventListener('keydown',e=>{if($('modal').open)return;if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()});window.addEventListener('pagehide',stop);render();
</script></body></html>
